[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-getter"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "shared-options",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "apscheduler>=3.10.4",
    "feedparser>=6.0.11",
    "python-dateutil>=2.8",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "accelerate>=0.25.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
shared-options = { path = "../options-shared", editable = true }
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
